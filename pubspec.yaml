name: gas
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0  # ← I lowered it slightly so it's compatible with most of your packages
               #   (you can raise it back to ^3.5.2 or ^3.6.0 if all packages support it)

dependencies:
  flutter:
    sdk: flutter

  # Localization (required even if you do manual translations)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.0                  # ← talks to the Next.js backend (REST + JWT)
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.1
  carousel_slider: ^5.0.0
  qr_flutter: ^4.1.0
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  flutter_launcher_icons: ^0.14.1
  flutter_dotenv: ^5.1.0         # ← loads .env (API_BASE_URL)
  permission_handler: ^11.3.1
  lottie: ^3.1.2
  smooth_page_indicator: ^2.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/image.png"
  min_sdk_android: 21 # optional: support older Android versions

flutter:
  # Enables Material Icons font
  uses-material-design: true

 
  generate: true

 
  assets:
    - .env                        
    - assets/icon/image.png
    - assets/lottie/lo.json
    - assets/lottie/qr.json
    - assets/lottie/fl.json
    - assets/lottie/splash.json


